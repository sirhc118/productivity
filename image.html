<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이미지 변환 — ToolKit</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0b;--sf:#141416;--sf2:#1c1c20;--bd:#2a2a30;--tx:#e8e8ec;--dim:#8888a0;--ac:#4af0c0;--acd:#4af0c020;--acm:#4af0c040;--red:#ff6b6b}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
.container{max-width:820px;margin:0 auto;padding:40px 24px 80px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--dim);text-decoration:none;font-size:13px;margin-bottom:32px;transition:.2s;font-family:'Space Mono',monospace}
.back:hover{color:var(--ac)}
header{text-align:center;margin-bottom:48px}
.logo{font-family:'Space Mono',monospace;font-size:13px;letter-spacing:4px;text-transform:uppercase;color:var(--ac);margin-bottom:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.logo::before,.logo::after{content:'';width:24px;height:1px;background:var(--ac);opacity:.4}
h1{font-size:32px;font-weight:700;margin-bottom:10px}
header p{color:var(--dim);font-size:15px;line-height:1.6}
.badge{display:inline-block;margin-top:12px;padding:4px 14px;background:var(--acd);border:1px solid var(--acm);border-radius:20px;font-size:12px;color:var(--ac);font-family:'Space Mono',monospace}
.dropzone{border:2px dashed var(--bd);border-radius:16px;padding:48px 32px;text-align:center;cursor:pointer;transition:.25s;position:relative;background:var(--sf)}
.dropzone:hover,.dropzone.dragover{border-color:var(--ac);background:var(--acd)}
.dropzone-icon{font-size:48px;margin-bottom:16px;display:block}
.dropzone-text{font-size:15px;color:var(--dim);line-height:1.7}
.dropzone-text strong{color:var(--ac)}
.dropzone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}

.options-card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:24px;margin-top:20px}
.options-title{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:16px}
.format-options{display:flex;gap:8px;flex-wrap:wrap}
.fmt-btn{padding:12px 24px;border-radius:8px;border:1px solid var(--bd);background:var(--sf2);color:var(--tx);cursor:pointer;font-size:14px;font-family:inherit;font-weight:600;transition:.2s}
.fmt-btn:hover{border-color:var(--ac)}
.fmt-btn.active{background:var(--acd);border-color:var(--ac);color:var(--ac)}

.quality-row{margin-top:16px;display:none;align-items:center;gap:12px}
.quality-row.show{display:flex}
.quality-row label{font-size:13px;color:var(--dim);white-space:nowrap}
.quality-row input[type=range]{flex:1;accent-color:var(--ac)}
.quality-row .q-val{font-family:'Space Mono',monospace;font-size:13px;color:var(--ac);min-width:36px}

.file-list{margin-top:20px}
.file-item{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--sf2);border-radius:10px;margin-bottom:8px;border:1px solid var(--bd)}
.file-item:hover{background:var(--sf)}
.file-icon{font-size:28px;flex-shrink:0}
.file-info{flex:1;min-width:0}
.file-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-size{font-size:12px;color:var(--dim);margin-top:2px}
.file-remove{background:0;border:0;color:var(--dim);cursor:pointer;font-size:18px;padding:4px 8px;border-radius:6px;transition:.15s}
.file-remove:hover{color:var(--red)}
.file-thumb{width:48px;height:48px;border-radius:6px;object-fit:cover;flex-shrink:0}

.action-bar{margin-top:28px;display:flex;gap:12px;align-items:center}
.btn-primary{flex:1;padding:16px 32px;border:0;border-radius:12px;background:var(--ac);color:var(--bg);font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 20px #4af0c035}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn-clear{padding:16px 20px;border:1px solid var(--bd);border-radius:12px;background:0;color:var(--dim);cursor:pointer;font-size:14px;font-family:inherit;transition:.2s}
.btn-clear:hover{border-color:var(--red);color:var(--red)}

.progress-bar{width:100%;height:6px;background:var(--sf2);border-radius:3px;margin-top:20px;overflow:hidden;display:none}
.progress-bar.active{display:block}
.progress-fill{height:100%;background:var(--ac);border-radius:3px;transition:width .3s;width:0}
.status-msg{font-size:13px;color:var(--dim);margin-top:12px;min-height:20px}

.results{margin-top:24px}
.result-item{display:flex;align-items:center;gap:12px;padding:16px;background:#4af0c010;border:1px solid var(--acm);border-radius:12px;margin-bottom:8px}
.result-item .file-info{flex:1;min-width:0}
.result-item .file-name{font-weight:600;font-size:14px}
.result-item .file-size{font-size:12px;color:var(--dim);margin-top:2px}
.btn-download-sm{padding:8px 16px;border-radius:8px;border:0;background:var(--ac);color:var(--bg);font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;text-decoration:none;white-space:nowrap}

footer{text-align:center;margin-top:56px;padding-top:24px;border-top:1px solid var(--bd)}
footer p{font-size:12px;color:var(--dim);line-height:1.8}
@media(max-width:600px){h1{font-size:24px}.container{padding:24px 16px 60px}.format-options{flex-direction:column}}
</style>
</head>
<body>
<div class="container">

<a href="index.html" class="back">← 도구 모음으로</a>

<header>
  <div class="logo">Image Convert</div>
  <h1>이미지 포맷 변환</h1>
  <p>JPG, PNG, WebP 간 자유롭게 변환. 여러 파일 일괄 처리.</p>
  <span class="badge">100% 클라이언트 사이드</span>
</header>

<div class="dropzone" id="drop">
  <span class="dropzone-icon">🖼️</span>
  <div class="dropzone-text">이미지를 드래그하거나 <strong>클릭하여 선택</strong> (여러 파일 가능)</div>
  <input type="file" accept="image/*" multiple onchange="addFiles(this.files)">
</div>

<div class="file-list" id="file-list"></div>

<div class="options-card" id="options" style="display:none">
  <div class="options-title">변환 포맷</div>
  <div class="format-options">
    <button class="fmt-btn active" onclick="pickFmt(this,'jpeg')">JPG</button>
    <button class="fmt-btn" onclick="pickFmt(this,'png')">PNG</button>
    <button class="fmt-btn" onclick="pickFmt(this,'webp')">WebP</button>
  </div>
  <div class="quality-row show" id="q-row">
    <label>품질</label>
    <input type="range" min="10" max="100" value="85" id="q-slider" oninput="document.getElementById('q-val').textContent=this.value+'%'">
    <span class="q-val" id="q-val">85%</span>
  </div>
</div>

<div class="status-msg" id="status"></div>
<div class="action-bar" id="actions" style="display:none">
  <button class="btn-primary" onclick="convert()" id="conv-btn">🖼️ 변환하기</button>
  <button class="btn-clear" onclick="clearAll()">초기화</button>
</div>
<div class="progress-bar" id="prog"><div class="progress-fill" id="fill"></div></div>
<div class="results" id="results"></div>

<footer><p>모든 처리는 브라우저에서 이루어집니다 · Canvas API 기반</p></footer>
</div>

<script>
let files=[];
let targetFmt='jpeg';

function $(id){return document.getElementById(id)}

function addFiles(fl){
  for(const f of fl){
    if(f.type.startsWith('image/')){
      files.push(f);
    }
  }
  render();
}

function render(){
  const list=$('file-list'),acts=$('actions'),opts=$('options');
  if(!files.length){list.innerHTML='';acts.style.display='none';opts.style.display='none';return}
  acts.style.display='flex';opts.style.display='block';

  list.innerHTML=files.map((f,i)=>{
    const url=URL.createObjectURL(f);
    return `<div class="file-item">
      <img src="${url}" class="file-thumb" onload="URL.revokeObjectURL('${url}')">
      <div class="file-info">
        <div class="file-name">${f.name}</div>
        <div class="file-size">${fmt(f.size)} · ${f.type.split('/')[1].toUpperCase()}</div>
      </div>
      <button class="file-remove" onclick="files.splice(${i},1);render()">✕</button>
    </div>`
  }).join('');
}

function pickFmt(btn,fmt){
  targetFmt=fmt;
  document.querySelectorAll('.fmt-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  // PNG doesn't have quality control
  const qr=$('q-row');
  qr.classList.toggle('show',fmt!=='png');
}

function fmt(b){if(b<1024)return b+' B';if(b<1048576)return(b/1024).toFixed(1)+' KB';return(b/1048576).toFixed(2)+' MB'}

async function convert(){
  if(!files.length)return;
  const btn=$('conv-btn'),bar=$('prog'),fill=$('fill'),st=$('status'),res=$('results');
  btn.disabled=true;btn.textContent='변환 중...';bar.classList.add('active');fill.style.width='0%';
  res.innerHTML='';

  const quality=parseInt($('q-slider').value)/100;
  const mimeType=targetFmt==='jpeg'?'image/jpeg':targetFmt==='png'?'image/png':'image/webp';
  const ext=targetFmt==='jpeg'?'jpg':targetFmt;

  let html='';

  for(let i=0;i<files.length;i++){
    st.textContent=`${i+1}/${files.length} 변환 중...`;
    fill.style.width=((i/files.length)*90)+'%';

    try{
      const blob=await convertOne(files[i],mimeType,quality);
      const url=URL.createObjectURL(blob);
      const newName=files[i].name.replace(/\.[^.]+$/,'.'+ext);

      html+=`<div class="result-item">
        <span class="file-icon">✅</span>
        <div class="file-info">
          <div class="file-name">${newName}</div>
          <div class="file-size">${fmt(files[i].size)} → ${fmt(blob.size)}</div>
        </div>
        <a href="${url}" download="${newName}" class="btn-download-sm">⬇️ 다운로드</a>
      </div>`;
    }catch(e){
      html+=`<div class="result-item" style="border-color:#ff6b6b40;background:#ff6b6b10">
        <span class="file-icon">❌</span>
        <div class="file-info"><div class="file-name">${files[i].name}</div><div class="file-size">${e.message}</div></div>
      </div>`;
    }
  }

  fill.style.width='100%';
  res.innerHTML=html;
  st.textContent='✅ 완료!';
  btn.disabled=false;btn.textContent='🖼️ 변환하기';
  setTimeout(()=>bar.classList.remove('active'),1000);
}

function convertOne(file,mimeType,quality){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement('canvas');
      canvas.width=img.naturalWidth;
      canvas.height=img.naturalHeight;
      const ctx=canvas.getContext('2d');

      // White background for JPEG (no alpha)
      if(mimeType==='image/jpeg'){
        ctx.fillStyle='#ffffff';
        ctx.fillRect(0,0,canvas.width,canvas.height);
      }

      ctx.drawImage(img,0,0);
      canvas.toBlob(blob=>{
        if(blob)resolve(blob);
        else reject(new Error('변환 실패'));
      },mimeType,mimeType==='image/png'?undefined:quality);
    };
    img.onerror=()=>reject(new Error('이미지 로드 실패'));
    img.src=URL.createObjectURL(file);
  });
}

function clearAll(){
  files=[];render();
  $('results').innerHTML='';$('status').textContent='';
  $('drop').querySelector('input').value='';
}

// Dropzone
const drop=$('drop');
drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('dragover')});
drop.addEventListener('dragleave',()=>drop.classList.remove('dragover'));
drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('dragover');addFiles(e.dataTransfer.files)});
</script>
</body>
</html>
